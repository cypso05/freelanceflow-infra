name: FreelanceFlow Pro CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 3️⃣ Create Azure Functions local.settings.json
      - name: Create local.settings.json from secrets
        run: |
          cat > api/local.settings.json << 'EOF'
          {
            "IsEncrypted": false,
            "Values": {
              "AzureWebJobsStorage": "${{ secrets.AZURE_WEBJOBS_STORAGE }}",
              "FUNCTIONS_WORKER_RUNTIME": "node",
              "COSMOS_DB_CONNECTION_STRING": "${{ secrets.COSMOS_DB_CONNECTION_STRING }}",
              "COSMOS_DATABASE_NAME": "${{ secrets.COSMOS_DATABASE_NAME }}",
              "AZURE_STORAGE_CONNECTION_STRING": "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}",
              "BLOB_CONTAINER_NAME": "${{ secrets.BLOB_CONTAINER_NAME }}",
              "ALLOWED_ORIGINS": "${{ secrets.ALLOWED_ORIGINS }}",
              "JWT_SECRET": "${{ secrets.JWT_SECRET }}",
              "NODE_ENV": "production"
            }
          }
          EOF
          echo "✅ Created api/local.settings.json"

      # 4️⃣ Install API dependencies (include dev for tests)
      - name: Install API Dependencies
        working-directory: ./api
        run: npm ci

      # 5️⃣ Run tests (optional but recommended)
      - name: Run API Tests
        working-directory: ./api
        run: npm test
        continue-on-error: true

      # 6️⃣ Deploy to Azure Static Web Apps
      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/public"
          api_location: "/api"
          output_location: ""
          skip_app_build: true
          # IMPORTANT: DO NOT skip API build
          skip_api_build: false

      # 7️⃣ Output deployment URL
      - name: Output Deployment URL
        run: |
          echo "✅ Deployment complete!"
          echo "🌐 App URL: ${{ steps.builddeploy.outputs.static_web_app_url }}"
          echo "🔑 API URL: ${{ steps.builddeploy.outputs.static_web_app_url }}/api"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request Deployment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
