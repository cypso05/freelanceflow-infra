name: FreelanceFlow Pro CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd api
          npm ci
        working-directory: ./

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # NEW token for your new app (get from Terraform output)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_FREELANCEFLOW_PRO }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### CRITICAL: Update these paths for your structure ######
          app_location: "/public" # Your HTML/CSS/JS files
          api_location: "/api" # Your API routes
          output_location: "" # No build output needed
          ###### End of Configurations ######

      - name: Run API Tests
        run: |
          echo "✅ Deployment complete"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_FREELANCEFLOW_PRO }}
          action: "close"
